<!DOCTYPE html>
<html lang="es" data-tema="moderno"><!-- chat_web.py reemplaza "moderno" por el tema guardado -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viernes</title>
<style>
  :root{
    /* Casi negro (sólido): la translucidez la hace la ventana entera
       (alpha uniforme, ver chat_web.ALPHA_VENTANA), no el CSS. */
    --bg: #16171c;
    --panel: rgba(255,255,255,.045);
    --panel-2: rgba(255,255,255,.085);
    --borde: rgba(255,255,255,.09);
    --texto: #f2f3f6;
    --tenue: #a7acb6;
    --acento: #4c8dff;
    --acento-2: #3f7be8;
    --cian: #57cfe6;
    --peligro: #f2564b;
    --verde: #33d17a;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  :root,html,body{ height:100%; background:transparent; overflow:hidden; }
  body{
    font-family:-apple-system,"Segoe UI Variable Display","Segoe UI",system-ui,"Helvetica Neue",sans-serif;
    color:var(--texto);
    -webkit-font-smoothing:antialiased;
  }

  .app{
    height:100%;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    border-radius:14px;
    overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  }

  /* ---------- cabecera ---------- */
  header{
    position:relative;
    display:flex; flex-direction:column; justify-content:center;
    gap:2px;
    padding:12px 16px;
    min-height:64px;
    border-bottom:1px solid var(--borde);
    background:rgba(255,255,255,.03);
    user-select:none;
  }
  .marca{ display:flex; align-items:center; gap:8px; font-weight:600; font-size:16px; letter-spacing:.2px; }
  .marca .rayo{ color:var(--cian); font-size:15px; }
  .estado{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--tenue); }
  .estado[hidden]{ display:none; }  /* el atributo hidden si no, lo pisa el display:flex de arriba */
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--tenue); flex:none; }
  .dot.vivo{ animation:latido 1.4s ease-in-out infinite; }
  @keyframes latido{ 0%,100%{opacity:1} 50%{opacity:.25} }

  /* fuera del <header> (que es zona de arrastre) para que los botones no
     disparen el drag */
  .ctrl{
    position:absolute; top:10px; right:10px; z-index:5;
    display:flex; gap:4px; opacity:0; transition:opacity .18s;
  }
  .app:hover .ctrl,
  .ctrl:has(.activo){ opacity:1; }   /* si está fijada, el pin queda visible */
  .ctrl button{
    width:24px; height:24px; border:0; border-radius:8px;
    background:rgba(255,255,255,.06); color:var(--tenue);
    font-size:13px; cursor:pointer; display:grid; place-items:center;
    transition:.12s;
  }
  .ctrl button:hover{ background:rgba(255,255,255,.14); color:var(--texto); }
  .ctrl .cerrar:hover{ background:var(--peligro); color:#fff; }
  .ctrl .pin svg{ width:13px; height:13px; }
  .ctrl #tema svg{ width:14px; height:14px; }
  .ctrl .pin.activo{ background:var(--acento); color:#fff; }
  .ctrl .pin.activo:hover{ background:var(--acento-2); }

  /* ---------- mensajes ---------- */
  .msgs{
    flex:1; overflow-y:auto; overflow-x:hidden;
    padding:14px 16px 6px;
    display:flex; flex-direction:column;
    scroll-behavior:smooth;
  }
  .msgs::-webkit-scrollbar{ width:9px; }
  .msgs::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.13); border-radius:20px; border:3px solid transparent; background-clip:content-box; }

  .row{ display:flex; flex-direction:column; max-width:100%; }
  .row.user{ align-items:flex-end; }
  .row.bot{ align-items:flex-start; }
  .row + .row{ margin-top:3px; }
  .row.nuevo{ margin-top:12px; }

  .meta{ font-size:11px; font-weight:600; color:var(--tenue); margin:0 6px 4px; }
  .row.bot .meta{ color:var(--cian); }

  .bubble{
    max-width:82%;
    padding:10px 14px;
    border-radius:19px;
    font-size:14px; line-height:1.42;
    white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere;
    animation:aparece .17s ease;
  }
  @keyframes aparece{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }
  .bubble.user{
    background:linear-gradient(135deg,var(--acento),var(--acento-2));
    color:#fff; border-bottom-right-radius:7px;
    box-shadow:0 2px 10px rgba(63,123,232,.28);
  }
  .bubble.bot{
    background:var(--panel-2);
    border:1px solid var(--borde);
    border-bottom-left-radius:7px;
  }

  .sys{ align-self:center; font-size:11px; color:var(--tenue); margin:10px 0; }

  .puntitos{ display:inline-flex; gap:4px; padding:3px 2px; }
  .puntitos i{ width:6px; height:6px; border-radius:50%; background:var(--tenue); animation:rebote 1s ease-in-out infinite; }
  .puntitos i:nth-child(2){ animation-delay:.15s; }
  .puntitos i:nth-child(3){ animation-delay:.3s; }
  @keyframes rebote{ 0%,80%,100%{ transform:translateY(0); opacity:.4; } 40%{ transform:translateY(-5px); opacity:1; } }

  /* ---------- barra de entrada ---------- */
  .barra{ padding:10px 16px 14px; display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--borde); background:rgba(255,255,255,.03); }
  .pill{
    display:flex; align-items:flex-end; gap:8px;
    background:var(--panel); border:1px solid var(--borde);
    border-radius:22px; padding:5px 5px 5px 6px;
    transition:border-color .15s;
  }
  .pill:focus-within{ border-color:rgba(120,160,255,.5); }

  .mic{
    width:36px; height:36px; flex:none;
    border:0; border-radius:50%; cursor:pointer;
    background:transparent; color:var(--tenue);
    display:grid; place-items:center; transition:.14s;
  }
  .mic svg{ width:18px; height:18px; }
  .mic:hover{ background:rgba(255,255,255,.08); color:var(--texto); }
  .mic.activo{ background:var(--peligro); color:#fff; animation:pulso 1.35s ease-in-out infinite; }
  @keyframes pulso{
    0%,100%{ box-shadow:0 0 0 0 rgba(242,86,75,.55); }
    70%{ box-shadow:0 0 0 9px rgba(242,86,75,0); }
  }
  #texto{
    flex:1; background:transparent; border:0; outline:0; resize:none;
    color:var(--texto); font:14px/1.4 inherit;
    max-height:120px; padding:9px 0;
  }
  #texto::placeholder{ color:rgba(255,255,255,.38); }
  .enviar{
    width:36px; height:36px; flex:none;
    border:0; border-radius:50%; cursor:pointer;
    background:linear-gradient(135deg,var(--acento),var(--acento-2));
    color:#fff; display:grid; place-items:center;
    transition:transform .12s, filter .12s, border-radius .18s, background .18s;
  }
  .enviar:hover{ filter:brightness(1.09); }
  .enviar:active{ transform:scale(.92); }
  .enviar svg{ width:17px; height:17px; }
  .enviar.stop{ background:var(--peligro); border-radius:11px; }

  .toggle{ display:flex; align-items:center; gap:9px; padding-left:4px; font-size:11.5px; color:var(--tenue); user-select:none; }
  .sw{ position:relative; width:38px; height:22px; flex:none; }
  .sw input{ opacity:0; width:0; height:0; }
  .sw span{ position:absolute; inset:0; border-radius:22px; background:rgba(255,255,255,.14); transition:.18s; }
  .sw span::before{ content:""; position:absolute; width:18px; height:18px; left:2px; top:2px; border-radius:50%; background:#fff; transition:.18s; box-shadow:0 1px 3px rgba(0,0,0,.35); }
  .sw input:checked + span{ background:var(--verde); }
  .sw input:checked + span::before{ transform:translateX(16px); }

  /* ============================================================
     TEMA RETRO — terminal CRT ámbar (clásico / retro-futuro).
     Todo va colgado de :root[data-tema="retro"]; el tema moderno
     es lo de arriba sin tocar. Mismo DOM: solo cambia el estilo.
     ============================================================ */
  :root[data-tema="retro"]{
    --bg:#0c0a06;
    --r-fg:#ffb552;      /* ámbar principal */
    --r-bright:#ffe0b0;
    --r-dim:#a06d2c;
    --r-line:rgba(255,181,82,.20);
  }
  :root[data-tema="retro"] body{
    font-family:"Cascadia Mono","Consolas","SF Mono","Roboto Mono","Courier New",monospace;
  }
  :root[data-tema="retro"] .app{
    background:var(--bg); color:var(--r-fg);
    border-radius:0;
    box-shadow:inset 0 0 0 1px var(--r-dim), inset 0 0 70px rgba(255,130,30,.05);
    text-shadow:0 0 3px rgba(255,150,50,.45);
  }

  /* barrido de líneas + viñeta CRT — solo en retro */
  #crt{ display:none; }
  :root[data-tema="retro"] #crt{
    display:block; position:absolute; inset:0; z-index:20; pointer-events:none;
    background:
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.16) 2px 3px),
      radial-gradient(130% 130% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);
    mix-blend-mode:multiply;
  }
  :root[data-tema="retro"] #crt::after{
    content:""; position:absolute; inset:0; background:rgba(255,180,90,.02);
    animation:crtflick .1s steps(2,end) infinite;
  }
  @keyframes crtflick{ 0%{opacity:.4} 100%{opacity:1} }

  :root[data-tema="retro"] header{
    background:transparent; border-bottom:1px solid var(--r-line);
    min-height:0; padding:9px 13px; gap:3px;
  }
  :root[data-tema="retro"] .marca{
    font-weight:700; font-size:12px; letter-spacing:3px;
    text-transform:uppercase; color:var(--r-bright);
  }
  :root[data-tema="retro"] .marca .rayo{ display:none; }
  :root[data-tema="retro"] .marca span:not(.rayo)::before{ content:"\25C8 "; color:var(--r-dim); }
  :root[data-tema="retro"] .estado{
    font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--r-dim); gap:6px;
  }
  :root[data-tema="retro"] #estadoTxt::before{ content:"[ "; }
  :root[data-tema="retro"] #estadoTxt::after{ content:" ]"; }
  :root[data-tema="retro"] .dot{ border-radius:0; width:6px; height:9px; background:var(--r-fg); }

  :root[data-tema="retro"] .ctrl{ gap:3px; }
  :root[data-tema="retro"] .ctrl button{
    width:auto; height:auto; min-width:20px; border-radius:0;
    background:transparent; border:1px solid var(--r-dim); color:var(--r-dim);
    font-family:inherit; font-size:10px; letter-spacing:.5px; padding:1px 5px;
  }
  :root[data-tema="retro"] .ctrl button:hover{ background:var(--r-dim); color:var(--bg); }
  :root[data-tema="retro"] .ctrl .cerrar:hover{ background:var(--r-fg); }
  :root[data-tema="retro"] .ctrl .pin svg,
  :root[data-tema="retro"] #tema svg{ display:none; }
  :root[data-tema="retro"] .ctrl .pin::after{ content:"TOP"; }
  :root[data-tema="retro"] #tema::after{ content:"MOD"; }
  :root[data-tema="retro"] .ctrl .pin.activo{
    background:var(--r-fg); color:var(--bg); border-color:var(--r-fg);
  }

  :root[data-tema="retro"] .msgs{ padding:12px 13px 8px; }
  :root[data-tema="retro"] .msgs::-webkit-scrollbar{ width:10px; }
  :root[data-tema="retro"] .msgs::-webkit-scrollbar-thumb{
    background:var(--r-dim); border-radius:0; border:2px solid var(--bg); background-clip:content-box;
  }
  :root[data-tema="retro"] .row{ align-items:stretch; }
  :root[data-tema="retro"] .row+.row{ margin-top:2px; }
  :root[data-tema="retro"] .row.nuevo{ margin-top:11px; }
  :root[data-tema="retro"] .meta{
    font-size:9.5px; letter-spacing:1px; text-transform:uppercase;
    color:var(--r-dim); margin:0 0 2px;
  }
  :root[data-tema="retro"] .row.bot .meta{ color:var(--r-dim); }
  :root[data-tema="retro"] .bubble{
    max-width:100%; padding:0; border:0; border-radius:0; box-shadow:none;
    background:transparent !important; color:var(--r-fg);
    font-size:12.5px; line-height:1.5;
  }
  :root[data-tema="retro"] .row.user .bubble{ color:var(--r-bright); }
  :root[data-tema="retro"] .row.user .bubble::before{ content:"> "; color:var(--r-dim); }
  :root[data-tema="retro"] .row.bot .bubble::before{ content:"\25C6 "; color:var(--r-dim); }
  :root[data-tema="retro"] .sys{
    color:var(--r-dim); text-transform:uppercase; letter-spacing:1.5px; font-size:10px;
  }
  :root[data-tema="retro"] .puntitos i{ display:none; }
  :root[data-tema="retro"] .puntitos::after{
    content:"PROCESANDO\258A"; letter-spacing:1px;
    color:var(--r-dim); font-size:12.5px; animation:blinkr 1s steps(1) infinite;
  }
  @keyframes blinkr{ 50%{ opacity:.25 } }

  :root[data-tema="retro"] .barra{
    background:transparent; border-top:1px solid var(--r-line); gap:8px; padding:10px 13px 12px;
  }
  :root[data-tema="retro"] .pill{
    background:transparent; border:1px solid var(--r-dim); border-radius:0;
    padding:5px 8px; align-items:center; gap:7px;
  }
  :root[data-tema="retro"] .pill::before{ content:"\203A"; color:var(--r-dim); font-size:14px; }
  :root[data-tema="retro"] .pill:focus-within{
    border-color:var(--r-fg); box-shadow:0 0 10px rgba(255,150,40,.22);
  }
  :root[data-tema="retro"] #texto{
    color:var(--r-bright); font-family:inherit; font-size:12.5px; padding:3px 0;
    caret-color:var(--r-fg);
  }
  :root[data-tema="retro"] #texto::placeholder{
    color:var(--r-dim); text-transform:uppercase; letter-spacing:1.5px; font-size:11px;
  }
  :root[data-tema="retro"] .mic,
  :root[data-tema="retro"] .enviar{
    width:auto; height:auto; border-radius:0; display:inline-flex; align-items:center;
    background:transparent; border:1px solid var(--r-dim); color:var(--r-fg);
    font-family:inherit; font-size:10px; letter-spacing:1px; padding:5px 9px;
    box-shadow:none; animation:none;
  }
  :root[data-tema="retro"] .mic svg,
  :root[data-tema="retro"] .enviar svg{ display:none; }
  :root[data-tema="retro"] .mic::after{ content:"MIC"; }
  :root[data-tema="retro"] .enviar::after{ content:"ENVIAR"; }
  :root[data-tema="retro"] .enviar.stop{ border-color:var(--r-fg); }
  :root[data-tema="retro"] .enviar.stop::after{ content:"STOP"; }
  :root[data-tema="retro"] .mic:hover,
  :root[data-tema="retro"] .enviar:hover{ background:var(--r-fg); color:var(--bg); }
  :root[data-tema="retro"] .mic.activo{
    background:var(--r-fg); color:var(--bg); border-color:var(--r-fg);
    animation:blinkr 1.1s steps(1) infinite;
  }
  :root[data-tema="retro"] .mic.activo::after{ content:"\25CF REC"; }

  :root[data-tema="retro"] .toggle{
    color:var(--r-dim); text-transform:uppercase; letter-spacing:1.5px; font-size:9.5px; gap:7px;
  }
  :root[data-tema="retro"] .sw{ width:auto; height:auto; }
  :root[data-tema="retro"] .sw input{ position:absolute; }
  :root[data-tema="retro"] .sw>span{ display:none; }
  :root[data-tema="retro"] .sw::after{ content:"[ OFF ]"; color:var(--r-dim); }
  :root[data-tema="retro"] .sw:has(input:checked)::after{ content:"[ ON  ]"; color:var(--r-fg); }
</style>
<script>
  // El tema inicial viene horneado en <html data-tema="..."> por chat_web.py.
  // Esto es solo una red de seguridad si por algo llegara vacío.
  (function () {
    var el = document.documentElement;
    if (el.dataset.tema !== 'retro' && el.dataset.tema !== 'moderno') {
      var t; try { t = localStorage.getItem('vrn_tema'); } catch (e) {}
      el.dataset.tema = t === 'retro' ? 'retro' : 'moderno';
    }
  })();
</script>
</head>
<body>
<div class="app">
  <div id="crt"></div>
  <div class="ctrl">
    <button id="tema" title="Cambiar a modo retro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3M6 8h.01M9 8h6"/></svg>
    </button>
    <button class="pin" id="pin" title="Fijar encima de todo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 10.76V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6.76a2 2 0 0 0 .59 1.42l1 1A2 2 0 0 1 18 15H6a2 2 0 0 1 1.41-3.83l1-1A2 2 0 0 0 9 10.76z"/></svg>
    </button>
    <button class="min" title="Minimizar" onclick="apiCall('minimizar')">–</button>
    <button class="cerrar" title="Cerrar" onclick="apiCall('cerrar')">×</button>
  </div>
  <header class="pywebview-drag-region">
    <div class="marca"><span class="rayo">⚡</span><span>Viernes</span></div>
    <div class="estado" hidden><span class="dot" id="dot"></span><span id="estadoTxt"></span></div>
  </header>

  <div class="msgs" id="msgs"></div>

  <div class="barra">
    <div class="pill">
      <button class="mic" id="mic" title="Hablar (lo mismo que F9)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
      </button>
      <textarea id="texto" rows="1" placeholder="Escribí un mensaje…" autocomplete="off"></textarea>
      <button class="enviar" id="btn" title="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </div>
    <label class="toggle">
      <span class="sw"><input type="checkbox" id="voz" checked><span></span></span>
      Responder por voz
    </label>
  </div>
</div>

<script>
  const $msgs = document.getElementById('msgs');
  const $texto = document.getElementById('texto');
  const $btn = document.getElementById('btn');
  const $voz = document.getElementById('voz');
  const $dot = document.getElementById('dot');
  const $estadoTxt = document.getElementById('estadoTxt');
  const $mic = document.getElementById('mic');
  const $pin = document.getElementById('pin');
  const $tema = document.getElementById('tema');

  let procesando = false;
  let ultimoQuien = null;
  let micActivo = false;

  const esRetro = () => document.documentElement.dataset.tema === 'retro';

  function apiCall(fn, ...args){
    if (window.pywebview && window.pywebview.api && window.pywebview.api[fn]){
      window.pywebview.api[fn](...args);
    }
  }

  function alFondo(){ $msgs.scrollTop = $msgs.scrollHeight; }

  function fila(quien){
    const r = document.createElement('div');
    r.className = 'row ' + (quien === 'usuario' ? 'user' : 'bot');
    if (ultimoQuien !== quien) r.classList.add('nuevo');
    ultimoQuien = quien;
    return r;
  }

  // ---- llamadas desde Python ----
  window.vrnAgregar = function(quien, texto, hora){
    const r = fila(quien);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (quien === 'usuario' ? 'Vos' : 'Viernes') + '  ·  ' + hora;
    const b = document.createElement('div');
    b.className = 'bubble ' + (quien === 'usuario' ? 'user' : 'bot');
    b.textContent = texto;
    r.append(meta, b);
    $msgs.appendChild(r);
    alFondo();
  };

  window.vrnSistema = function(texto){
    ultimoQuien = null;
    const s = document.createElement('div');
    s.className = 'sys';
    s.textContent = texto;
    $msgs.appendChild(s);
    alFondo();
  };

  let $pensando = null;
  window.vrnPensando = function(on){
    if (on){
      if ($pensando) return;
      ultimoQuien = null;
      const r = fila('asistente');
      const b = document.createElement('div');
      b.className = 'bubble bot';
      b.innerHTML = '<span class="puntitos"><i></i><i></i><i></i></span>';
      r.appendChild(b);
      $msgs.appendChild(r);
      $pensando = r;
      alFondo();
    } else if ($pensando){
      $pensando.remove();
      $pensando = null;
    }
  };

  let ultimoEstado = ['', '#6b7078'];   // [texto crudo, color] — para re-render al cambiar de tema
  window.vrnEstado = function(texto, color){
    ultimoEstado = [texto || '', color || ultimoEstado[1]];
    let t = ultimoEstado[0];
    // en retro el terminal siempre muestra algo ([ LISTO ] en reposo)
    if (esRetro() && !t) t = 'Listo';
    $estadoTxt.textContent = t;
    $dot.style.background = ultimoEstado[1];
    $dot.classList.toggle('vivo', /Escuchando|Transcribiendo|preguntando/i.test(t));
    document.querySelector('.estado').hidden = !t;
    // el botón de mic solo queda encendido mientras está grabando
    if (!/Escuchando/i.test(t)) apagarMic();
  };

  function apagarMic(){
    micActivo = false;
    $mic.classList.remove('activo');
  }

  $mic.addEventListener('click', () => {
    if (procesando) return;               // hay un mensaje de texto en curso
    micActivo = !micActivo;
    $mic.classList.toggle('activo', micActivo);
    apiCall('mic', micActivo);            // true = grabar, false = cortar y procesar
  });

  window.vrnReactivar = function(){
    procesando = false;
    $btn.classList.remove('stop');
    $texto.disabled = false;
    $texto.focus();
  };

  // ---- envío ----
  function enviar(){
    if (procesando){ apiCall('cancelar'); return; }
    const t = $texto.value.trim();
    if (!t) return;
    $texto.value = '';
    autoGrow();
    procesando = true;
    $btn.classList.add('stop');
    $texto.disabled = true;
    apiCall('enviar', t);
  }

  $btn.addEventListener('click', enviar);
  $texto.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviar(); }
  });

  function autoGrow(){
    $texto.style.height = 'auto';
    $texto.style.height = Math.min($texto.scrollHeight, 120) + 'px';
  }
  $texto.addEventListener('input', autoGrow);

  $voz.addEventListener('change', () => apiCall('set_voz', $voz.checked));

  // ---- fijar encima de todo (pin) ----
  let fijado = false;
  try { fijado = localStorage.getItem('vrn_pin') === '1'; } catch (e) {}

  function aplicarPin(){
    $pin.classList.toggle('activo', fijado);
    $pin.title = fijado ? 'Desfijar' : 'Fijar encima de todo';
    apiCall('pin', fijado);
    try { localStorage.setItem('vrn_pin', fijado ? '1' : '0'); } catch (e) {}
  }
  $pin.addEventListener('click', () => { fijado = !fijado; aplicarPin(); });

  // ---- cambiar de tema (moderno <-> retro), en caliente ----
  function aplicarTema(t){
    document.documentElement.dataset.tema = t;
    $tema.title = t === 'retro' ? 'Volver al modo moderno' : 'Cambiar a modo retro';
    try { localStorage.setItem('vrn_tema', t); } catch (e) {}
    apiCall('set_tema', t);                       // Python lo guarda para el próximo arranque
    window.vrnEstado(ultimoEstado[0], ultimoEstado[1]);  // re-render del cartel de estado
  }
  $tema.addEventListener('click', () => {
    aplicarTema(esRetro() ? 'moderno' : 'retro');
  });

  window.addEventListener('pywebviewready', () => {
    apiCall('ready');
    $tema.title = esRetro() ? 'Volver al modo moderno' : 'Cambiar a modo retro';
    if (fijado) aplicarPin();   // restaurar el estado fijado de la sesión anterior
  });
</script>
</body>
</html>
